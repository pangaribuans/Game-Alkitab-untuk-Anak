<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Alkitab Anak</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--langit:#e6f3ff;--navy:#1b2a4e;--mentari:#ffc93c;--rumput:#2fa96b;--koral:#e8575a;--garis:#c9d8ef}
*{box-sizing:border-box}
body{margin:0;background:var(--langit);color:var(--navy);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:17px}
header{background:var(--navy);color:#fff;padding:18px 16px 20px;text-align:center;border-bottom:6px solid var(--mentari)}
h1{margin:0 0 12px;font-size:1.5rem}
h2{margin:0 0 10px;font-size:1.25rem;line-height:1.35}
select{width:100%;max-width:440px;padding:12px;font:inherit;border:0;border-radius:14px;color:var(--navy)}
main{max-width:480px;margin:0 auto;padding:16px}
.kartu{background:#fff;border:2px solid var(--garis);border-radius:18px;padding:16px;margin-bottom:14px}
.info{font-size:.95rem;color:#51608a;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{padding:14px 8px;font:inherit;background:#fff;color:var(--navy);border:2px solid var(--garis);border-radius:18px;cursor:pointer;line-height:1.3}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv b{display:block;font-size:1.15rem}
.opt{display:block;width:100%;margin:8px 0;padding:13px 14px;font:inherit;text-align:left;background:#fff;color:var(--navy);border:2px solid var(--garis);border-radius:14px;cursor:pointer}
.opt.ok{background:#d6f3e4;border-color:var(--rumput)}
.opt.no{background:#fde1e1;border-color:var(--koral)}
.btn{display:inline-block;margin:6px 6px 0 0;padding:12px 18px;font:inherit;font-weight:700;color:var(--navy);background:var(--mentari);border:0;border-radius:14px;cursor:pointer}
.btn.abu{background:#fff;border:2px solid var(--garis)}
.petunjuk{margin:6px 0;padding:10px 12px;background:#fff7d6;border-radius:12px}
.status{display:flex;justify-content:space-between;font-size:.95rem;color:#51608a;margin-bottom:8px}
.umpan{margin:10px 0 0;font-weight:700}
.besar{font-size:2.4rem;text-align:center;margin:4px 0}
button:focus-visible,select:focus-visible{outline:3px solid var(--mentari);outline-offset:2px}
@keyframes muncul{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.muncul{animation:muncul .35s ease-out}
@keyframes masuk{from{opacity:0;transform:translateX(-18px)}}
.muncul .opt{animation:masuk .4s ease-out backwards}
.muncul .opt:nth-child(2){animation-delay:.08s}.muncul .opt:nth-child(3){animation-delay:.16s}.muncul .opt:nth-child(4){animation-delay:.24s}
.titik{display:flex;gap:4px;margin-bottom:10px}.titik i{flex:1;height:8px;border-radius:4px;background:var(--garis)}
.titik i.s{background:var(--rumput)}.titik i.k{background:var(--mentari)}
.maskot{font-size:2.6rem;text-align:center;animation:goyang 2s ease-in-out infinite}
@keyframes goyang{50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes geter{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.geter{animation:geter .4s}
@keyframes lompat{40%{transform:scale(1.05)}}
.opt.ok{animation:lompat .4s}
.opt:active,.btn:active{transform:scale(.97)}
.konfeti{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:kf 1.6s ease-in forwards;z-index:9}
@keyframes kf{to{transform:translateY(105vh) rotate(360deg);opacity:.3}}
#medan{position:relative;height:380px;overflow:hidden;background:#d8ecff;border-radius:14px}
.jatuh{position:absolute;top:-50px;padding:10px 12px;font:inherit;border:2px solid var(--garis);border-radius:14px;background:#fff;color:var(--navy);animation:turun 4s linear forwards;cursor:pointer}
@keyframes turun{to{transform:translateY(440px)}}
.medan2{position:relative;height:90px;background:#d8ecff;border-radius:14px;overflow:hidden;margin-bottom:10px}
.tengah{position:absolute;left:41%;width:18%;top:0;bottom:0;background:#bfe8cf}
.gol{position:absolute;top:16px;font-size:3rem;transform:translateX(-50%)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hewan{font-size:2rem}
.pilih{border-color:var(--mentari)!important;transform:scale(1.08)}
.masuk{opacity:.35;transform:scale(.7);transition:.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lv.cocok{opacity:1;background:#d6f3e4;border-color:var(--rumput)}.buka{background:#fff7d6}.hewan small{display:block;font-size:.6rem;line-height:1.1}
.kbd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.kbd button{padding:10px 0;font:inherit;font-weight:700;border:2px solid var(--garis);border-radius:10px;background:#fff;color:var(--navy);cursor:pointer}.kbd button:disabled{opacity:.3}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dua .opt{font-size:.85rem;padding:10px}
.gk{display:grid;gap:3px;margin-bottom:10px}.gk button{aspect-ratio:1;padding:0;font:inherit;font-weight:700;border:1px solid var(--garis);background:#fff;color:var(--navy);border-radius:6px;font-size:.95rem;cursor:pointer}.gk button.pilih{background:var(--mentari)}.gk button.cocok{background:#bfe8cf}
.kata{display:flex;flex-wrap:wrap;gap:8px}.kata .lv{padding:10px 12px}
.mem{font-size:.9rem;line-height:1.2;min-height:86px}.mem small,.hewan.mem small{font-size:.75rem;font-weight:700}
.ark{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.pasang{display:flex;gap:8px;align-items:center;justify-content:center}.pasang span{font-size:2rem}
.slot{font-size:2rem;padding:10px;background:#fff;border:2px dashed var(--garis);border-radius:14px;opacity:.3;filter:grayscale(1);cursor:pointer}.slot.isi{opacity:1;filter:none;border:2px solid var(--rumput);background:#d6f3e4}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg{display:grid;gap:2px;margin-bottom:10px}.tc{position:relative}.tc input{width:100%;aspect-ratio:1;text-align:center;font:inherit;font-weight:700;text-transform:uppercase;border:2px solid var(--garis);border-radius:6px;padding:0;color:var(--navy);background:#fff}.tc sup{position:absolute;top:1px;left:3px;font-size:.55rem;color:#51608a;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>📖 Game Alkitab Anak</h1>
  <select id="pilih" aria-label="Pilih game"></select>
</header>
<main id="app"></main>

<script>
/* ============ DAFTAR GAME ============
   [nomor, nama, pakai level?, sudah dibuat?] */
const DAFTAR=[
 [1,"Tebak Tokoh Alkitab",1,1],[2,"Susun Kalimat Kisah",1,1],[3,"Tebak Huruf Alkitab",1,1],
 [4,"Memory Card: Tokoh dan Bendanya",1,1],[5,"Isi Titik-titik Kisah",1,1],[6,"Urutkan Kisah",1,1],
 [7,"Teka-teki Silang Alkitab",1,1],[8,"Cari Kata Alkitab",1,1],
 [9,"Puzzle Pasangan Hewan Bahtera",0,1],[10,"Daud Melempar Batu",0,1],[11,"Hafal Urutan 66 Kitab",0,1],
 [12,"Peta Perjalanan Paulus",0,1],[13,"Tebak Gambar Mukjizat",0,1],[14,"Buah Roh",0,1],[15,"Jodohkan Benda & Tempat Alkitab",0,1]
];

/* ============ DATA: TEBAK TOKOH ============
   Format: "Nama|petunjuk sulit|petunjuk sedang|petunjuk mudah" (5 level x 10) */
const TOKOH=[
[
"Adam|Allah membentuk aku dari debu tanah.|Aku tinggal di Taman Eden.|Aku manusia pertama.",
"Hawa|Aku dibentuk dari tulang rusuk.|Aku tergoda oleh ular.|Aku wanita pertama.",
"Nuh|Aku membuat kapal yang sangat besar.|Aku mengumpulkan hewan berpasangan.|Pelangi adalah tanda janji Allah kepadaku.",
"Musa|Aku ditemukan di keranjang di Sungai Nil.|Aku menerima Sepuluh Perintah Allah.|Aku memimpin Israel keluar dari Mesir.",
"Daud|Dulu aku gembala domba.|Aku menulis banyak mazmur.|Aku mengalahkan Goliat dengan umban.",
"Daniel|Aku bekerja pada raja Babel.|Aku berdoa tiga kali sehari.|Aku dilempar ke gua singa.",
"Yunus|Aku lari dari perintah Allah.|Aku naik kapal ke Tarsis.|Aku tiga hari dalam perut ikan besar.",
"Maria|Malaikat Gabriel menemuiku.|Aku tinggal di Nazaret.|Aku ibu Yesus.",
"Petrus|Aku nelayan di Galilea.|Aku berjalan di atas air menuju Yesus.|Aku menyangkal Yesus tiga kali.",
"Simson|Aku orang nazir sejak lahir.|Kekuatanku ada pada rambutku.|Delila memotong rambutku."
],[
"Abraham|Allah menyuruhku pergi dari Haran.|Allah berjanji keturunanku sebanyak bintang.|Aku hampir mempersembahkan anakku Ishak.",
"Ishak|Aku anak yang lama dijanjikan.|Ayahku hampir mempersembahkan aku.|Istriku bernama Ribka.",
"Yakub|Aku punya kembaran bernama Esau.|Aku bermimpi tentang tangga ke surga.|Namaku diganti menjadi Israel.",
"Yusuf|Aku punya jubah warna-warni.|Saudara-saudaraku menjualku.|Aku menjadi penguasa di Mesir.",
"Rut|Aku berasal dari Moab.|Aku setia kepada mertuaku Naomi.|Aku memungut gandum di ladang Boas.",
"Ester|Aku dibesarkan oleh Mordekhai.|Aku menjadi ratu Persia.|Aku menyelamatkan bangsa Yahudi dari Haman.",
"Elia|Aku nabi pada zaman raja Ahab.|Api turun dari langit di Gunung Karmel.|Aku naik ke surga dengan kereta berapi.",
"Zakheus|Aku bertubuh pendek.|Aku pemungut cukai di Yerikho.|Aku naik pohon ara untuk melihat Yesus.",
"Yohanes Pembaptis|Aku makan belalang dan madu hutan.|Aku berseru di padang gurun.|Aku membaptis Yesus di Sungai Yordan.",
"Yudas Iskariot|Aku salah satu dari dua belas murid.|Aku memegang kantong uang.|Aku menyerahkan Yesus dengan ciuman."
],[
"Yosua|Aku pengintai yang setia ke Kanaan.|Aku menggantikan Musa.|Tembok Yerikho runtuh di bawah pimpinanku.",
"Debora|Aku duduk di bawah pohon korma.|Aku hakim dan nabiah.|Aku memimpin Israel bersama Barak.",
"Samuel|Ibuku Hana berdoa memintaku.|Aku dilayankan kepada imam Eli di Silo.|Aku mengurapi Saul dan Daud.",
"Saul|Aku lebih tinggi dari semua orang.|Aku sedang mencari keledai ayahku.|Aku raja Israel yang pertama.",
"Salomo|Aku meminta hikmat kepada Allah.|Aku memutuskan perkara dua ibu dan satu bayi.|Aku membangun Bait Allah.",
"Elisa|Aku dipanggil saat sedang membajak.|Aku menerima jubah Elia.|Aku menyembuhkan Naaman dari kusta.",
"Matius|Aku pemungut cukai.|Yesus memanggilku untuk mengikut Dia.|Aku menulis Injil yang pertama.",
"Paulus|Dulu namaku Saulus.|Aku bertemu Yesus dalam cahaya di jalan ke Damsyik.|Aku rasul bagi bangsa-bangsa lain.",
"Lazarus|Aku tinggal di Betania.|Saudariku bernama Marta dan Maria.|Yesus membangkitkan aku dari kubur.",
"Marta|Aku tinggal di Betania.|Aku sibuk melayani saat Yesus bertamu.|Saudariku Maria duduk dekat kaki Yesus."
],[
"Gideon|Aku dua kali meminta tanda dengan bulu domba.|Allah mengurangi pasukanku menjadi 300 orang.|Aku mengalahkan Midian dengan sangkakala dan obor.",
"Rahab|Aku tinggal di tembok kota Yerikho.|Aku menyembunyikan dua pengintai.|Tali merah di jendelaku menyelamatkan keluargaku.",
"Hana|Aku lama tidak punya anak.|Aku berdoa dengan sungguh-sungguh di Silo.|Anakku Samuel kuserahkan kepada Tuhan.",
"Nehemia|Aku juru minuman raja Persia.|Aku pulang ke Yerusalem.|Aku memimpin pembangunan kembali tembok kota.",
"Yeremia|Aku dipanggil saat masih muda.|Aku dikenal sebagai nabi peratap.|Aku menubuatkan kehancuran Yerusalem.",
"Barnabas|Namaku berarti anak penghiburan.|Aku menjual ladangku untuk jemaat.|Aku menemani Paulus dalam pelayanan awal.",
"Timotius|Ibuku Eunike dan nenekku Lois.|Aku masih muda saat melayani.|Paulus menulis dua surat kepadaku.",
"Nikodemus|Aku anggota Mahkamah Agama.|Aku datang kepada Yesus pada waktu malam.|Yesus berkata aku harus dilahirkan kembali.",
"Ayub|Aku kaya, lalu kehilangan segalanya.|Tiga temanku datang menghiburku.|Aku tetap setia dan Allah memulihkan aku.",
"Naaman|Aku panglima tentara Aram.|Aku sakit kusta.|Aku tujuh kali mandi di Sungai Yordan."
],[
"Elisabet|Aku sudah tua dan dianggap mandul.|Aku kerabat Maria.|Anakku bernama Yohanes Pembaptis.",
"Simeon|Aku orang benar di Yerusalem.|Roh Kudus berkata aku akan melihat Mesias sebelum mati.|Aku menggendong bayi Yesus di Bait Allah.",
"Natan|Aku nabi pada zaman raja Daud.|Aku bercerita tentang domba kesayangan seorang miskin.|Aku menegur Daud tentang Batsyeba.",
"Belsyazar|Aku raja Babel.|Aku berpesta dengan perkakas Bait Allah.|Sebuah tangan menulis di dinding istanaku.",
"Lidia|Aku pedagang kain ungu.|Aku berasal dari kota Tiatira.|Aku percaya lewat khotbah Paulus di Filipi.",
"Eutikhus|Aku duduk di tepi jendela.|Aku mengantuk saat Paulus berkhotbah panjang.|Aku jatuh dari lantai tiga lalu dihidupkan kembali.",
"Matias|Aku mengikut Yesus sejak awal.|Namaku terpilih lewat undian.|Aku menggantikan Yudas Iskariot.",
"Ezra|Aku imam dan ahli Taurat.|Aku memimpin gelombang pulang dari Babel.|Aku membacakan Taurat kepada seluruh umat.",
"Apolos|Aku berasal dari Aleksandria.|Aku pandai berbicara tentang Kitab Suci.|Priskila dan Akwila menjelaskan jalan Allah kepadaku.",
"Stefanus|Aku salah satu dari tujuh diaken.|Aku penuh Roh Kudus dan hikmat.|Aku martir yang pertama."
]];

/* ============ DATA: KUIS ============
   Format: "Pertanyaan|Jawaban benar|salah 1|salah 2|salah 3" (5 level x 10) */
const KUIS=[
[
"Siapa yang membuat bahtera?|Nuh|Musa|Daud|Abraham",
"Siapa yang dilempar ke gua singa?|Daniel|Yunus|Petrus|Yusuf",
"Siapa yang mengalahkan Goliat?|Daud|Simson|Saul|Musa",
"Di kota mana Yesus dilahirkan?|Betlehem|Nazaret|Yerusalem|Yerikho",
"Berapa jumlah murid Yesus?|12|7|10|40",
"Siapa ibu Yesus?|Maria|Marta|Hana|Ester",
"Apa yang Allah ciptakan pada hari pertama?|Terang|Binatang|Manusia|Matahari",
"Siapa yang ditelan ikan besar?|Yunus|Daniel|Nuh|Elia",
"Siapa yang memimpin Israel keluar dari Mesir?|Musa|Yosua|Daud|Salomo",
"Apa nama kitab pertama dalam Alkitab?|Kejadian|Keluaran|Mazmur|Matius"
],[
"Berapa hari hujan turun pada zaman Nuh?|40 hari|7 hari|12 hari|100 hari",
"Siapa kakak Habel?|Kain|Set|Esau|Ishak",
"Siapa yang dijual saudara-saudaranya ke Mesir?|Yusuf|Benyamin|Yehuda|Ruben",
"Berapa roti dan ikan yang dipakai Yesus untuk memberi makan 5.000 orang?|5 roti dan 2 ikan|7 roti dan 3 ikan|2 roti dan 5 ikan|12 roti dan 2 ikan",
"Siapa yang menyangkal Yesus tiga kali?|Petrus|Yohanes|Yakobus|Tomas",
"Siapa yang membaptis Yesus di Sungai Yordan?|Yohanes Pembaptis|Petrus|Paulus|Andreas",
"Siapa raja Israel yang pertama?|Saul|Daud|Salomo|Samuel",
"Di kota mana Yesus mengubah air menjadi anggur?|Kana|Kapernaum|Betania|Nain",
"Allah berbicara kepada Musa dari apa?|Semak yang menyala|Awan|Gunung|Pohon palem",
"Siapa pemungut cukai yang naik pohon untuk melihat Yesus?|Zakheus|Matius|Lewi|Nikodemus"
],[
"Berapa jumlah kitab dalam Alkitab?|66|39|27|70",
"Apa kitab pertama dalam Perjanjian Baru?|Matius|Markus|Kisah Para Rasul|Roma",
"Siapa istri Abraham?|Sara|Ribka|Rahel|Lea",
"Siapa yang kehilangan kekuatan saat rambutnya dipotong?|Simson|Daud|Gideon|Saul",
"Siapa ratu yang menyelamatkan bangsa Yahudi di Persia?|Ester|Rut|Debora|Hana",
"Di gunung mana Musa menerima Sepuluh Perintah Allah?|Sinai|Karmel|Zaitun|Nebo",
"Siapa yang namanya diganti menjadi Israel?|Yakub|Abraham|Ishak|Yusuf",
"Berapa jumlah anak laki-laki Yakub?|12|7|10|3",
"Siapa nabi yang naik ke surga dengan kereta berapi?|Elia|Elisa|Yesaya|Yeremia",
"Siapa mertua Rut?|Naomi|Hana|Debora|Ester"
],[
"Siapa yang menggantikan Elia sebagai nabi?|Elisa|Yesaya|Samuel|Yosua",
"Siapa yang memimpin Israel masuk ke Tanah Kanaan setelah Musa?|Yosua|Kaleb|Harun|Gideon",
"Kota mana yang temboknya runtuh setelah dikelilingi Israel?|Yerikho|Betlehem|Damsyik|Niniwe",
"Siapa putra Daud yang terkenal dengan hikmatnya?|Salomo|Absalom|Yonatan|Adonia",
"Siapa yang menulis Kitab Kisah Para Rasul?|Lukas|Markus|Yohanes|Petrus",
"Saulus kemudian dikenal dengan nama apa?|Paulus|Petrus|Barnabas|Silas",
"Siapa hakim perempuan yang memimpin Israel bersama Barak?|Debora|Ester|Rut|Hana",
"Di jalan menuju kota mana Saulus bertemu Yesus?|Damsyik|Yerusalem|Antiokhia|Efesus",
"Siapa anak kecil yang dipanggil Allah di Silo?|Samuel|Daud|Yeremia|Daniel",
"Siapa tiga sahabat Daniel yang dilempar ke perapian?|Sadrakh, Mesakh, dan Abednego|Petrus, Yakobus, dan Yohanes|Sem, Ham, dan Yafet|Kain, Habel, dan Set"
],[
"Siapa ayah Yohanes Pembaptis?|Zakharia|Yusuf|Simeon|Elkana",
"Siapa yang mengurapi Daud menjadi raja?|Samuel|Natan|Elia|Eli",
"Siapa nabi yang menegur Daud setelah dosanya dengan Batsyeba?|Natan|Elisa|Yesaya|Gad",
"Siapa nama ayah Daud?|Isai|Obed|Boas|Yakub",
"Siapa raja Babel yang melihat tulisan di dinding?|Belsyazar|Nebukadnezar|Koresh|Darius",
"Berapa orang pasukan Gideon yang tersisa melawan Midian?|300|1.000|12.000|3.000",
"Siapa pedagang kain ungu dari Tiatira yang percaya lewat Paulus?|Lidia|Priskila|Dorkas|Lois",
"Siapa yang dipilih menggantikan Yudas Iskariot?|Matias|Barnabas|Silas|Stefanus",
"Di pulau mana Yohanes menerima penglihatan Kitab Wahyu?|Patmos|Kreta|Siprus|Malta",
"Siapa pemuda yang jatuh dari jendela saat Paulus berkhotbah?|Eutikhus|Timotius|Titus|Apolos"
]];

const GAME={1:{mode:"tokoh",data:TOKOH}};
const NAMA_LEVEL=["Mudah","Lumayan","Sedang","Sulit","Ahli"];
const LULUS=7;

/* ============ ALAT BANTU ============ */
const $=s=>document.querySelector(s);
const app=$("#app");
const acak=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let prog={};
try{prog=JSON.parse(localStorage.getItem("alkitab-anak")||"{}")}catch(e){}
const simpan=()=>{try{localStorage.setItem("alkitab-anak",JSON.stringify(prog))}catch(e){}};
const BUKA_SEMUA=location.search.includes("buka=1"); // untuk uji coba: index.html?buka=1
const nilai=(g,l)=>(prog[g]||{})[l]||0;
const terbuka=(g,l)=>BUKA_SEMUA||l===1||nilai(g,l-1)>=LULUS;
const bintang=n=>n>=10?"⭐⭐⭐":n>=9?"⭐⭐":n>=LULUS?"⭐":"☆";
const namaGame=g=>DAFTAR.find(d=>d[0]===g)[1];

/* ============ DROPDOWN ============ */
(function isiPilihan(){
  const s=$("#pilih");
  const opsi=d=>`<option value="${d[0]}" ${d[3]?"":"disabled"}>${d[0]}. ${d[1]}${d[3]?"":" (segera)"}</option>`;
  s.innerHTML=`<option value="">— Pilih game —</option>
   <optgroup label="Pakai level">${DAFTAR.filter(d=>d[2]).map(opsi).join("")}</optgroup>
   <optgroup label="Tanpa level">${DAFTAR.filter(d=>!d[2]).map(opsi).join("")}</optgroup>`;
  s.onchange=()=>{const g=+s.value;g?((GAME[g]||MULAI[g])?menuLevel(g):MINI[g]()):beranda()};
})();

/* ============ LAYAR ============ */
function beranda(){
  app.innerHTML=`<div class="kartu"><div class="besar">🕊️</div>
  <h2>Selamat datang!</h2><p class="info">Pilih game dari daftar di atas, lalu mulai bermain dan belajar tentang firman Tuhan.</p></div>`;
}

function menuLevel(g){
  const tombol=[1,2,3,4,5].map(l=>{
    const buka=terbuka(g,l);
    return `<button class="lv" ${buka?"":"disabled"} onclick="mulai(${g},${l})">
      <b>Level ${l}</b>${NAMA_LEVEL[l-1]}<br>${buka?bintang(nilai(g,l)):"🔒"}</button>`;
  }).join("");
  app.innerHTML=`<div class="kartu"><h2>${namaGame(g)}</h2>
   <p class="info">Jawab benar minimal ${LULUS} dari 10 soal untuk membuka level berikutnya.</p></div>
   <div class="grid">${tombol}</div>
   <p class="info" style="margin-top:14px"><button class="btn abu" onclick="reset(${g})">Ulangi dari awal</button></p>`;
}

let S={};
function mulai(g,l){
  if(MULAI[g]) return MULAI[g](l);
  const {mode,data}=GAME[g];
  const baris=acak(data[l-1].map(s=>s.split("|")));
  const nama=data[l-1].map(s=>s.split("|")[0]);
  const items=baris.map(b=>mode==="kuis"
    ?{tanya:b[0],jawab:b[1],opsi:acak(b.slice(1,5))}
    :{jawab:b[0],petunjuk:b.slice(1,4),opsi:acak([b[0],...acak(nama.filter(n=>n!==b[0])).slice(0,3)])});
  S={g,l,mode,items,i:0,benar:0,poin:0,p:1,kunci:false,beruntun:0};baru();
  soal();
}

function soal(){
  if(S.i>=S.items.length) return hasil();
  const it=S.items[S.i];
  const titik=S.items.map((_,n)=>`<i class="${n<S.i?"s":n===S.i?"k":""}"></i>`).join("");
  const atas=`<div class="titik">${titik}</div><div class="status"><span>${S.l?"Level "+S.l+" • ":""}Soal ${S.i+1} dari ${S.items.length}</span><span>${S.beruntun>1?"🔥"+S.beruntun+" ":""}✅ ${S.benar}</span></div><div class="maskot">${S.m}</div>`;
  let isi;
  if(S.mode==="kuis"){
    isi=`<h2>${it.tanya}</h2>`;
  }else{
    const daftar=it.petunjuk.slice(0,S.p).map((t,n)=>`<div class="petunjuk">💡 <small>Petunjuk ${n+1} dari 3</small><br>${t}</div>`).join("");
    const lagi=!S.kunci&&S.p<3?`<button class="btn abu" onclick="petunjuk()">Petunjuk berikutnya (poin berkurang)</button>`:"";
    isi=`<h2>Siapa aku?</h2>${daftar}${lagi}`;
  }
  const pilihan=it.opsi.map((o,n)=>`<button class="opt" onclick="jawab(${n})">${o}</button>`).join("");
  app.innerHTML=`<div class="kartu${S.baru?" muncul":""}">${atas}${isi}<div id="pilihan">${pilihan}</div><div id="umpan"></div></div>`;S.baru=false;
}

function petunjuk(){
  if(S.kunci||S.p>=3) return;
  S.p++;
  soal();
}

function jawab(n){
  if(S.kunci) return;
  S.kunci=true;
  const it=S.items[S.i];
  const benar=it.opsi[n]===it.jawab;
  document.querySelectorAll("#pilihan .opt").forEach((b,k)=>{
    b.disabled=true;
    if(it.opsi[k]===it.jawab) b.classList.add("ok");
    else if(k===n) b.classList.add("no");
  });
  if(benar){S.benar++;S.beruntun++; if(S.mode==="tokoh") S.poin+=4-S.p;}else S.beruntun=0;
  efek(benar);
  const lanjut=S.i===S.items.length-1?"Lihat hasil":"Lanjut ▶";
  $("#umpan").innerHTML=`<p class="umpan">${benar?"🎉 Benar!":"Jawaban yang benar: "+it.jawab}</p>
   <button class="btn" onclick="berikut()">${lanjut}</button>`;
  const lagi=document.querySelector("#app .btn.abu");
  if(lagi) lagi.remove();
}

function berikut(){S.i++;S.p=1;S.kunci=false;baru();soal();}

function hasil(){
  const {g,l,benar}=S;
  const sk=Math.round(S.benar*10/S.items.length);
  const lulus=!S.bebas&&sk>=LULUS;
  if(!S.bebas&&sk>nilai(g,l)){prog[g]=prog[g]||{};prog[g][l]=sk;simpan();}
  const pesan=sk===10?"Sempurna! Luar biasa!":sk>=LULUS?(S.bebas?"Hebat sekali!":"Hebat! Kamu lulus level ini."):"Ayo coba lagi, kamu pasti bisa!";
  const poin=S.mode==="tokoh"?`<p class="info" style="text-align:center">Poin: ${S.poin} dari 30</p>`:"";
  let tombol=`<button class="btn" onclick="${S.bebas?"MINI["+g+"]()":"mulai("+g+","+l+")"}">🔁 Main lagi</button>`;
  if(lulus&&l<5) tombol=`<button class="btn" onclick="mulai(${g},${l+1})">Level ${l+1} ▶</button>`+tombol;
  if(!S.bebas) tombol+=`<button class="btn abu" onclick="menuLevel(${g})">Pilih level</button>`;
  const tamat=lulus&&l===5?`<p class="umpan" style="text-align:center">🏆 Kamu sudah menamatkan semua level!</p>`:"";
  app.innerHTML=`<div class="kartu"><div class="besar">${bintang(S.bebas?benar:sk)}</div>
   <h2 style="text-align:center">${benar} dari ${S.items.length} benar</h2>
   <p class="info" style="text-align:center">${pesan}</p>${poin}${tamat}<div>${tombol}</div></div>`;
}

function reset(g){
  if(!confirm("Hapus semua kemajuan game ini?")) return;
  delete prog[g];simpan();menuLevel(g);
}

/* ============ TTS (game 7) ============ */
function buatTTS(kata){
  let best=null;
  for(let t=0;t<300&&!(best&&best.pl.length===kata.length);t++){
    const G=new Map(),D=new Map(),pl=[],K=(y,x)=>y+","+x;
    const taruh=(w,c,y,x,dy,dx)=>{[...w].forEach((ch,k)=>{const q=K(y+dy*k,x+dx*k);G.set(q,ch);D.set(q,(D.get(q)||"")+(dy?"v":"h"))});pl.push({w,c,y,x,dy,dx})};
    const bisa=(w,y,x,dy,dx)=>{
      if(G.has(K(y-dy,x-dx))||G.has(K(y+dy*w.length,x+dx*w.length))) return false;
      let sil=0;
      for(let k=0;k<w.length;k++){const yy=y+dy*k,xx=x+dx*k,q=K(yy,xx);
        if(G.has(q)){if(G.get(q)!==w[k]||D.get(q).includes(dy?"v":"h")) return false;sil++;}
        else if(G.has(K(yy+dx,xx+dy))||G.has(K(yy-dx,xx-dy))) return false;}
      return sil>0;};
    const urut=acak(kata);taruh(urut[0][0],urut[0][1],0,0,0,1);
    for(const [w,c] of urut.slice(1)){let ok=false;
      for(const [q,ch] of acak([...G])){const [cy,cx]=q.split(",").map(Number);
        for(let k=0;k<w.length&&!ok;k++){if(w[k]!==ch) continue;
          for(const [dy,dx] of acak([[0,1],[1,0]])){const y=cy-dy*k,x=cx-dx*k;if(bisa(w,y,x,dy,dx)){taruh(w,c,y,x,dy,dx);ok=true;break;}}}
        if(ok) break;}}
    if(!best||pl.length>best.pl.length) best={pl,G};
  }
  return best;
}
MULAI[7]=l=>{
  const kata=TOKOH[l-1].map(t=>t.split("|")).filter(b=>/^[A-Za-z]+$/.test(b[0])).map(b=>[b[0].toUpperCase(),b[3]]);
  const h=buatTTS(acak(kata).slice(0,[4,5,6,7,8][l-1]));
  const ks=[...h.G.keys()].map(k=>k.split(",").map(Number)),Y=ks.map(a=>a[0]),X=ks.map(a=>a[1]);
  const y0=Math.min(...Y),y1=Math.max(...Y),x0=Math.min(...X),x1=Math.max(...X);
  const urut=[...h.pl].sort((a,b)=>a.y-b.y||a.x-b.x),no=new Map();let n=0;
  urut.forEach(q=>{const k=q.y+","+q.x;if(!no.has(k)) no.set(k,++n);});
  let sel="";
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const ch=h.G.get(y+","+x);
    sel+=ch?`<div class="tc"><sup>${no.get(y+","+x)||""}</sup><input maxlength="1" data-a="${ch}" autocapitalize="characters" autocomplete="off"></div>`:`<div></div>`;}
  const daftar=(dy,j)=>`<p class="info"><b>${j}</b><br>${urut.filter(q=>q.dy===dy).map(q=>no.get(q.y+","+q.x)+". "+q.c).join("<br>")}</p>`;
  let coba=0;
  app.innerHTML=`<div class="kartu muncul"><h2>✏️ Teka-teki Silang • Level ${l}</h2><p class="info">Isi nama tokoh sesuai petunjuk. Geser kotak ke samping jika terlalu lebar.</p>
   <div style="overflow-x:auto"><div class="tg" style="grid-template-columns:repeat(${x1-x0+1},30px)">${sel}</div></div>
   ${daftar(0,"Mendatar ➡️")}${daftar(1,"Menurun ⬇️")}<button class="btn" id="cek">✅ Periksa</button></div>`;
  $("#cek").onclick=()=>{coba++;let semua=true;
    document.querySelectorAll(".tg input").forEach(i=>{const ok=i.value.toUpperCase()===i.dataset.a;i.style.background=ok?"#d6f3e4":i.value?"#fde1e1":"#fff";if(!ok) semua=false;});
    if(semua) selesai(7,l,coba<=1?10:coba<=3?9:7,`TTS selesai, ${coba} kali periksa!`);else efek(false);};
};
